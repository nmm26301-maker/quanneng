name: Check Quanneng
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check media request header policy
        run: |
          mkdir -p android/build/header-tests
          javac -d android/build/header-tests android/app/src/main/java/app/quanneng/PlaybackHeaders.java android/tests/PlaybackHeadersCheck.java
          java -cp android/build/header-tests PlaybackHeadersCheck
          javac -d android/build/header-tests android/app/src/main/java/app/quanneng/MediaCandidatePolicy.java android/tests/MediaCandidateCheck.java
          java -cp android/build/header-tests MediaCandidateCheck
      - name: Prepare Android SDK paths
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/quanneng-sdk"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/build-tools_r35_linux.zip -o "$RUNNER_TEMP/build-tools.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/platform-35_r02.zip -o "$RUNNER_TEMP/platform.zip"
          echo "bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88  $RUNNER_TEMP/build-tools.zip" | sha256sum -c -
          echo "0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0  $RUNNER_TEMP/platform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/build-tools.zip" -d "$RUNNER_TEMP/quanneng-sdk"
          unzip -q "$RUNNER_TEMP/platform.zip" -d "$RUNNER_TEMP/quanneng-sdk"
      - run: python3 android/tools/build.py --sdk "$RUNNER_TEMP/quanneng-sdk" --keystore "$RUNNER_TEMP/quanneng.p12" --out "$RUNNER_TEMP/Quanneng-debug.apk" --abi x86_64
      - name: Check bounded local media endpoint
        run: |
          mkdir -p android/build/range-tests
          javac -encoding UTF-8 -cp "$RUNNER_TEMP/quanneng-sdk/quanneng-dependencies/nanohttpd/classes.jar" -d android/build/range-tests android/app/src/main/java/app/quanneng/NetworkPolicy.java android/app/src/main/java/app/quanneng/MediaShareServer.java android/tests/MediaRangeCheck.java
          java -cp "android/build/range-tests:$RUNNER_TEMP/quanneng-sdk/quanneng-dependencies/nanohttpd/classes.jar" app.quanneng.MediaRangeCheck
      - uses: actions/upload-artifact@v4
        with:
          name: Quanneng-debug
          path: ${{ runner.temp }}/Quanneng-debug.apk

      - name: Download public playback fixture and build instrumentation APK
        run: |
          curl --fail --location --retry 3 https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4 -o android/tests/assets/flower.mp4
          python3 android/tools/build-tests.py --sdk "$RUNNER_TEMP/quanneng-sdk" --keystore "$RUNNER_TEMP/quanneng.p12" --out "$RUNNER_TEMP/Quanneng-tests.apk"
      - name: Set up Android emulator tools
        uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          cmdline-tools-version: '12266719'
      - name: Enable emulator acceleration on the ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Android network and content URI playback
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 180
          script: |
            adb install -r "$RUNNER_TEMP/Quanneng-debug.apk"
            adb install -r "$RUNNER_TEMP/Quanneng-tests.apk"
            # Same precondition as Android CTS: test app controls after OS education.
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb logcat -c
            timeout 180s adb shell am instrument -w app.quanneng.tests/app.quanneng.tests.SecuritySmoke | tee "$RUNNER_TEMP/security-smoke.txt"
            adb logcat -d -v brief > "$RUNNER_TEMP/security-logcat.txt"
            timeout 180s adb shell am instrument -w app.quanneng.tests/app.quanneng.tests.FeatureSmoke | tee "$RUNNER_TEMP/features-smoke.txt"
            adb logcat -d -v brief > "$RUNNER_TEMP/features-logcat.txt"
            tail -n 180 "$RUNNER_TEMP/features-logcat.txt"
            grep -q QUANNENG_FEATURES_OK "$RUNNER_TEMP/features-smoke.txt"
            timeout 120s adb shell am instrument -w app.quanneng.tests/app.quanneng.tests.ShareSmoke | tee "$RUNNER_TEMP/share-smoke.txt"
            adb logcat -d -v brief > "$RUNNER_TEMP/share-logcat.txt"
            tail -n 120 "$RUNNER_TEMP/share-logcat.txt"
            grep -q QUANNENG_SHARE_OK "$RUNNER_TEMP/share-smoke.txt"
            timeout 300s adb shell am instrument -w app.quanneng.tests/app.quanneng.tests.PlaybackSmoke | tee "$RUNNER_TEMP/playback-smoke.txt"
            adb logcat -d -v brief > "$RUNNER_TEMP/playback-logcat.txt"
            tail -n 180 "$RUNNER_TEMP/playback-logcat.txt"
            timeout 120s adb shell am instrument -w app.quanneng.tests/app.quanneng.tests.BrowserSmoke | tee "$RUNNER_TEMP/browser-smoke.txt"
            adb logcat -d -v brief > "$RUNNER_TEMP/browser-logcat.txt"
            timeout 300s adb shell am instrument -w app.quanneng.tests/app.quanneng.tests.TransferSmoke | tee "$RUNNER_TEMP/transfer-smoke.txt"
            adb logcat -d -v brief > "$RUNNER_TEMP/transfer-logcat.txt"
            grep -q QUANNENG_SECURITY_OK "$RUNNER_TEMP/security-smoke.txt" && grep -q QUANNENG_SMOKE_OK "$RUNNER_TEMP/playback-smoke.txt" && grep -q QUANNENG_BROWSER_OK "$RUNNER_TEMP/browser-smoke.txt" && grep -q QUANNENG_TRANSFER_OK "$RUNNER_TEMP/transfer-smoke.txt"
            adb shell am force-stop app.quanneng
            adb shell locksettings set-pin 482947
            timeout 150s adb shell am instrument -w app.quanneng.tests/app.quanneng.tests.SystemUnlockSmoke | tee "$RUNNER_TEMP/system-unlock-smoke.txt"
            adb logcat -d -v brief > "$RUNNER_TEMP/system-unlock-logcat.txt"
            grep -q QUANNENG_SYSTEM_UNLOCK_OK "$RUNNER_TEMP/system-unlock-smoke.txt"
      - name: Save Android playback test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-playback-smoke
          path: |
            ${{ runner.temp }}/system-unlock-smoke.txt
            ${{ runner.temp }}/system-unlock-logcat.txt
            ${{ runner.temp }}/playback-smoke.txt
            ${{ runner.temp }}/playback-logcat.txt
            ${{ runner.temp }}/browser-smoke.txt
            ${{ runner.temp }}/browser-logcat.txt
            ${{ runner.temp }}/security-smoke.txt
            ${{ runner.temp }}/security-logcat.txt
            ${{ runner.temp }}/transfer-smoke.txt
            ${{ runner.temp }}/transfer-logcat.txt
            ${{ runner.temp }}/features-smoke.txt
            ${{ runner.temp }}/features-logcat.txt
            ${{ runner.temp }}/share-smoke.txt
            ${{ runner.temp }}/share-logcat.txt
          if-no-files-found: ignore
