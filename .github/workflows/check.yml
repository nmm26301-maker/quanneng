name: Check Quanneng
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK paths
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$RUNNER_TEMP/quanneng-sdk"
          ln -s "$ANDROID_HOME/build-tools/35.0.0" "$RUNNER_TEMP/quanneng-sdk/android-15"
          ln -s "$ANDROID_HOME/platforms/android-35" "$RUNNER_TEMP/quanneng-sdk/android-35"
      - run: python3 android/tools/build.py --sdk "$RUNNER_TEMP/quanneng-sdk" --keystore "$RUNNER_TEMP/quanneng.p12" --out "$RUNNER_TEMP/Quanneng-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Quanneng-debug
          path: ${{ runner.temp }}/Quanneng-debug.apk
